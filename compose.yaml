services:
  web:
    build: .
    ports:
      - "5001:5000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app_password@db:5432/contacts
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: contacts
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d contacts"]
      interval: 5s
      timeout: 3s
      retries: 10

  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  metabase-data: