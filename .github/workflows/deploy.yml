name: Build, push and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up emulation for other chip types
        uses: docker/setup-qemu-action@v3

      - name: Set up multi-platform builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-fe:build-${{ github.run_number }}

      - name: Tell Render to deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"